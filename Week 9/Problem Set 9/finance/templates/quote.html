{% extends "layout.html" %}

{% block title %}
    Get Stock Quote
{% endblock %}

{% block main %}
    <form action="/quote" method="post">
        <div>
            <label for="symbol">Symbol</label>
            <input type="text" name="symbol" id="symbol" placeholder="Symbol">
        </div>
        <button class="btn btn-primary" type="submit">Get Stock quote</button>
    </form>
{% endblock %}
